apiVersion: apps/v1
kind: Deployment
metadata:
  name: cardio-app-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cardio-app
  template:
    metadata:
      labels:
        app: cardio-app
    spec:
      containers:
      - name: cardio-app
        image: cardio-app:latest
        imagePullPolicy: IfNotPresent  # Changed from Never
        ports:
        - containerPort: 8501
        env:
        - name: MLFLOW_TRACKING_URI
          value: "file:///app/mlruns"
        volumeMounts:
        - name: mlruns-volume
          mountPath: /app/mlruns
      volumes:
      - name: mlruns-volume
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: cardio-app-service
spec:
  type: NodePort
  selector:
    app: cardio-app
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8501
    nodePort: 30007