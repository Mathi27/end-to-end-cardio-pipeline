apiVersion: apps/v1
kind: Deployment
metadata:
  name: cardio-app-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cardio-app
  template:
    metadata:
      labels:
        app: cardio-app
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "5000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: cardio-app
        image: cardio-app:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5000
          name: http
        env:
        - name: MLFLOW_TRACKING_URI
          value: "file:///app/mlruns"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 5
        volumeMounts:
        - name: mlruns-volume
          mountPath: /app/mlruns
      volumes:
      - name: mlruns-volume
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: cardio-app-service
spec:
  type: NodePort
  selector:
    app: cardio-app
  ports:
  - protocol: TCP
    port: 80
    targetPort: 5000
    nodePort: 30007
  - protocol: TCP
    port: 9090
    targetPort: 5000
    name: metrics