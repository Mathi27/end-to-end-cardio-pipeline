name: Heart Disease MLOps Pipeline

on:
  push:
    branches: [ "main", "master", "Master" ]   
  pull_request:
    branches: [ "main", "master", "Master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    # 1. Checkout Code
    - name: Checkout code
      uses: actions/checkout@v3

    # 2. Setup Python
    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    # 3. Install Dependencies
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # 4. Linting (Check code quality)
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    # 5. Train Model (Automated Training in CI)
    - name: Train Model
      run: |
        python train.py

    # 6. Run Tests (Verify Model & Pipeline)
    - name: Run Unit Tests
      run: |
        pytest tests/
        
    # 7. Upload MLflow Artifacts (The Final Requirement)
    - name: Upload Artifacts
      if: always()  # Run this even if tests fail
      uses: actions/upload-artifact@v4
      with:
        name: mlflow-logs
        path: mlruns/